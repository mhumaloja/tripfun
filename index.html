<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <title>TripFun</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>TripFun 🚗</h1>
      <p id="status" class="status"></p>
    </header>

    <!-- 1. Nimen syöttö -->
    <section id="join-view" hidden>
      <p class="lead">Liity matkapeliin!</p>
      <form id="join-form">
        <label for="name">Nimesi tai nimimerkkisi</label>
        <input id="name" name="name" maxlength="16" autocomplete="nickname" required autofocus>
        <button type="submit">Mukaan!</button>
      </form>
      <p class="code">Peli <strong id="join-code"></strong></p>
    </section>

    <!-- 2. Aula: odotetaan kysymystä -->
    <section id="lobby-view" hidden>
      <p class="lead">Hei <strong class="me-name"></strong>! Odotetaan seuraavaa kysymystä…</p>
    </section>

    <!-- 3. Kysymys -->
    <section id="question-view" hidden>
      <div class="timer"><span id="seconds"></span> s</div>
      <p id="question-text" class="question"></p>
      <div id="options" class="options"></div>
      <p id="answered" class="lead" hidden>Vastaus lähetetty! Oikea vastaus paljastuu, kun aika loppuu…</p>
    </section>

    <!-- 4. Kierroksen tulos -->
    <section id="result-view" hidden>
      <p id="result-title" class="result"></p>
      <p class="lead">Oikea vastaus: <strong id="result-answer"></strong></p>
    </section>

    <!-- Pisteet näkyvät liittymisen jälkeen aina -->
    <section id="scores-view" hidden>
      <h2>Pisteet</h2>
      <ul id="scores"></ul>
    </section>

    <!-- Virhe: koodi puuttuu -->
    <section id="no-code-view" hidden>
      <p class="lead">Skannaa auton näytöllä oleva QR-koodi liittyäksesi peliin.</p>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
